name: Learning Lesson v2 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: learning-lesson-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: learning-lesson-v2

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: learning-lesson-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, unit tests, and build
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_FAKE_AUTH: "1"
          ALLOW_E2E_FAKE_AUTH: "1"

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug-${{ github.run_id }}
          path: |
            learning-lesson-v2/playwright-report/
            learning-lesson-v2/test-results/
          if-no-files-found: ignore
          retention-days: 7
